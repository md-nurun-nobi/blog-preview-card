<!doctype html>

<link rel="preconnect"

>

<main class="min-h-screen bg-yellow-200 
 flex justify-center items-center p-4 sm:p-6 font-[Outfit]

 mt-3 leading-6 ">These languages are the backbone of every website,
          defining structure, content, and presentation.</p>

          <div class="flex items-center gap-3 mt-6">
            <img src="/images/image-avatar.webp"
             alt="Greg Hooper"

<p class="text-slate-900 text-sm font-bold ">Greg Hooper</p>
